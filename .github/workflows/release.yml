name: Release
# Manual only: the `release` environment allows protected branches, so a pushed tag could
# not reach it, and a dispatch states the intended version explicitly. Publishing uses npm
# trusted publishing (OIDC); no npm token is stored anywhere. See docs/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal package.json (for example 0.1.3)
        required: true
        type: string
      publish:
        description: Publish the checked tarball to npm (false builds a candidate only)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Check the requested version matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$actual" ]; then
            echo "::error::Requested version $VERSION does not match package.json version $actual"
            exit 1
          fi
      - name: Check the version is above the latest on npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          latest="$(npm view @zof-ai/cli version)"
          node -e '
            const parse = (v) => { const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v); if (!m) throw new Error("not x.y.z: " + v); return m.slice(1).map(Number); };
            const [a, b] = [parse(process.argv[1]), parse(process.argv[2])];
            const cmp = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            if (cmp <= 0) { console.error("::error::Version " + process.argv[1] + " is not above the latest npm version " + process.argv[2]); process.exit(1); }
          ' "$VERSION" "$latest"
      - name: Prepare pinned GitHub release dependencies
        run: node scripts/bootstrap.mjs --allow-network
      - run: npm ci --ignore-scripts --prefer-offline
      - run: npm run check
      - name: Pack
        id: pack
        run: |
          mkdir -p dist-pack
          tarball="$(npm pack --ignore-scripts --pack-destination dist-pack | tail -n 1)"
          sha256="$(sha256sum "dist-pack/$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball sha256 $sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: dist-pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

  # Publishes the exact tarball checked above; no checkout or rebuild, and only this job can
  # mint the OIDC token that npm trusted publishing exchanges for a short-lived publish token.
  publish:
    needs: candidate
    if: inputs.publish && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install npm 11.5+ (required for trusted publishing)
        run: npm install --global --ignore-scripts npm@11.21.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: npm-tarball
          path: dist-pack
      - name: Verify the tarball is the one that was checked
        env:
          TARBALL: ${{ needs.candidate.outputs.tarball }}
          EXPECTED: ${{ needs.candidate.outputs.sha256 }}
        run: echo "$EXPECTED  dist-pack/$TARBALL" | sha256sum --check --strict
      - name: Publish with provenance
        env:
          TARBALL: ${{ needs.candidate.outputs.tarball }}
        run: npm publish "dist-pack/$TARBALL" --access public --provenance
